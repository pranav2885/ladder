[project]
name = "ladder"
version = "0.1.0"
description = "Smallest-model-first router for CPU AI inference"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "sqlmodel>=0.0.16",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "psutil>=5.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ladder = "ladder.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ladder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
